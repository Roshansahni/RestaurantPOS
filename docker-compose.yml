services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pos_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: restaurantpos
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U pos_user -d restaurantpos"], interval: 5s, retries: 10}
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://pos_user:${DB_PASSWORD}@db:5432/restaurantpos
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGINS: http://localhost:5173
      UPLOAD_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    depends_on: {db: {condition: service_healthy}}
    ports: ["8000:8000"]
  web:
    build:
      context: ./frontend
      args: {VITE_API_URL: "http://localhost:8000/api"}
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  pgdata:
  uploads:
